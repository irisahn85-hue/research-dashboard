async function unlock(key){const buf=b64(DATA);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
window.__siteKey=key;let html=new TextDecoder().decode(plain);html=html.includes('</body>')?html.replace('</body>',HOOK+'</body>'):html+HOOK;
document.open();document.write(html);document.close();}
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(SALT),iterations:ITER},base,{name:'AES-GCM',length:256},true,['decrypt']);}
(async()=>{try{const saved=sessionStorage.getItem('siteKey:'+SALT);if(saved){await unlock(await crypto.subtle.importKey('raw',b64(saved),'AES-GCM',true,['decrypt']));}}catch(e){try{sessionStorage.removeItem('siteKey:'+SALT)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const go=document.getElementById('go'),err=document.getElementById('err');go.disabled=true;err.textContent='Unlocking…';
try{const key=await derive(document.getElementById('pw').value);const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA).slice(0,12)},key,b64(DATA).slice(12));
if(document.getElementById('remember').checked){try{sessionStorage.setItem('siteKey:'+SALT,btoa(String.fromCharCode(...raw)))}catch(_){}}
await unlock(key);}catch(x){go.disabled=false;err.textContent='Incorrect password.';}});
